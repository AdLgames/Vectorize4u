[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorize-api"
version = "0.1.0"
description = "FastAPI service: owns /v1, the credit ledger, Stripe webhooks and migrations."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "boto3>=1.35",
    "celery>=5.4",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.12",
    "stripe>=11.1",
    "vectorize-engine",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "types-boto3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Autogenerated migrations are Alembic's output, not hand-written code.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# B008 flags `Depends(...)` in argument defaults. That is FastAPI's
# documented dependency-injection syntax, not a mutable-default bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
