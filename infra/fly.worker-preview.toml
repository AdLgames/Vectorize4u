# §4.2 lane 1 of 3: the preview pool.
#
# This lane is the sales pitch — stage A p95 under 2 seconds — so it is
# always warm, never scaled to zero, and never shares a machine with batch
# work.
#
#   fly deploy -c infra/fly.worker-preview.toml
app = "vectorize-worker-preview"
primary_region = "lhr"

# No [build] section: see the note in fly.api.toml. The deploy commands in
# the Makefile pass --dockerfile and the context explicitly.

[env]
  # "staging" and "prod" harden identically — same secret checks, same
  # refusal of the local storage backend. The only difference is that
  # staging may run with VEC_PAYMENTS_ENABLED=0, so the first deploy can
  # happen before Stripe exists. Change this to "prod" in the same commit
  # that turns payments on.
  VEC_ENVIRONMENT = "staging"
  VEC_STORAGE_BACKEND = "r2"
  QUEUES = "queue_preview"
  CONCURRENCY = "4"
  # Every 25th preview would otherwise pay for a child recycle — measured
  # at 1.07 s against a 0.44 s baseline. These jobs are small and short, so
  # the fragmentation that 25 exists to bound does not build up here.
  VEC_MAX_TASKS_PER_CHILD = "200"

# No [http_service]: workers take work from Redis, not from the internet.
[[vm]]
  size = "performance-2x"
  memory = "4gb"

[processes]
  worker = ""
