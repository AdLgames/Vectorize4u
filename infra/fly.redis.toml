# Redis as a machine we own, not a metered service.
#
# §2 is specific about this: "Fixed-price Redis on the worker's private
# network. Celery polls constantly; per-command-priced Redis (e.g. Upstash
# pay-as-you-go) turns idle polling into a bill." `fly redis create` is
# Upstash, and it is metered — three idle workers polling a broker all day
# is a lot of commands for zero work done.
#
# The second reason matters more than the money: **a broker must never
# evict.** Upstash's default plans evict under memory pressure, and an
# evicted Celery message is a paid job that silently never runs. The config
# below sets `noeviction` and keeps the data on a volume.
#
#   fly apps create vectorize-redis
#   fly volumes create redis_data --size 1 --region lhr -a vectorize-redis
#   fly deploy -c infra/fly.redis.toml --image redis:7-alpine .
#
# Reachable from the other apps at redis://vectorize-redis.internal:6379/0
# on the private network — it is never exposed publicly, which is why there
# is no [http_service] here and no password: nothing outside the
# organisation can route to it.
app = "vectorize-redis"
primary_region = "lhr"

# Arguments to the image's own entrypoint. `--maxmemory-policy noeviction`
# is the load-bearing one: a queued job is work someone has paid for, and
# refusing writes when full is loud and recoverable where evicting is
# silent and is not.
[processes]
  app = "redis-server --appendonly yes --dir /data --maxmemory 768mb --maxmemory-policy noeviction"

[[mounts]]
  source = "redis_data"
  destination = "/data"
  processes = ["app"]

# No [[services]] at all, deliberately. A service on Fly is a *published*
# port — it must expose at least one and belong to a process group, and
# the config is rejected without both. This Redis is not published: every
# machine on the organisation's private network can already reach it at
# vectorize4u-redis.internal:6379 over 6PN, which is the only access it
# should ever have.
#
# The side effect is the one we want: auto-stop is driven by service
# traffic, so an app with no services does not stop. A broker that goes to
# sleep is the failure this whole file exists to avoid.

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
