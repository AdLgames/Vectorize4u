# Check the deployed site, from a phone.
#
# Vercel builds on push, so there is no deploy stage here — only the
# question a Vercel build cannot answer: is the site that shipped pointed
# at the live API, or at the localhost default it falls back to when the
# environment variables are missing? See docs/deploy-the-web-app.md.

name: Verify the site

on:
  workflow_dispatch:
    inputs:
      site:
        description: >-
          The deployed site, with scheme — your domain once it is attached,
          or the vercel.app URL before that. It must match whatever
          NEXT_PUBLIC_SITE_URL was set to at build time, because the
          sitemap and every canonical are baked in.
        required: true
        type: string
        default: https://vectorize4u.vercel.app
      api:
        description: The API the site should be talking to.
        required: true
        type: string
        default: https://vectorize4u-api.fly.dev
      supabase:
        description: >-
          Whether to check sign-in too. "auto" reads the project URL out of
          what the site shipped, so there is no twenty-character project ref
          to mistype; give a URL to pin a specific project, or empty to skip
          sign-in and check only the site. Nothing is emailed either way:
          the check is read-only, because a real magic-link round trip needs
          an inbox and burns the project's email rate limit.
        required: false
        type: string
        default: auto

      payments:
        description: >-
          "yes" also checks that this deployment can take money: payments
          reported on, the site's prices matching what the API charges, and
          a webhook that refuses an unsigned event. Nothing is bought — a
          real purchase needs a session and a card. Leave it "no" until the
          stripe stage has run and been deployed, or this fails by design.
        required: false
        type: string
        default: "no"

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Is the site wired to the live API
        run: |
          python scripts/verify_site.py "${{ inputs.site }}" --api "${{ inputs.api }}"

      # Separate from the site check because the causes are separate: the
      # site can be perfectly wired to the API while sign-in is broken by a
      # project that still signs with the legacy shared secret.
      - name: Is sign-in wired to the same Supabase project
        if: inputs.supabase != ''
        run: |
          python scripts/verify_auth.py "${{ inputs.site }}" \
            --api "${{ inputs.api }}" --supabase "${{ inputs.supabase }}"

      - name: Can this deployment take money
        if: inputs.payments == 'yes'
        run: |
          python scripts/verify_payments.py "${{ inputs.site }}" --api "${{ inputs.api }}"

      - name: What to change if that failed
        if: failure()
        run: |
          echo "The failure above names the cause. The two that need a rebuild,"
          echo "not a settings change, because Next bakes them in at build time:"
          echo
          echo " * 'still points at 127.0.0.1:8000' -> NEXT_PUBLIC_API_BASE was"
          echo "   missing from the Vercel build. Set it, then redeploy."
          echo " * 'advertises vectorize.example'   -> NEXT_PUBLIC_SITE_URL was"
          echo "   missing. Set it to the real domain, then redeploy."
          echo
          echo "Setting an environment variable in Vercel does not change a build"
          echo "that already happened. Redeploy after every change to these two."
