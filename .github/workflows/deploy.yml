# Deploy from GitHub's web UI, because a phone has no terminal.
#
# Everything here is normally `flyctl` on a laptop. Run from Actions →
# Deploy → "Run workflow" instead, and the only credential that exists is
# FLY_API_TOKEN in this repository's secrets — it never passes through a
# chat window or a developer's shell history.
#
# The stages are separate on purpose: `bootstrap` creates things and is
# safe to re-run, `secrets` writes configuration, `deploy` ships code, and
# `verify` converts a real image against whatever is already live.
# Running them out of order fails loudly rather than half-deploying.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: What to run
        required: true
        type: choice
        default: bootstrap
        options:
          - bootstrap
          - secrets
          - deploy
          - verify
          - stripe
          - everything
      region:
        description: Fly region — all apps and the database must share one
        required: true
        type: string
        default: ams
      org:
        description: >-
          Fly organisation *slug*, which is not its name — a personal
          account is displayed under your own name and its slug is
          "personal". `flyctl orgs list` prints both; so does the first
          step of this job.
        required: true
        type: string
        default: personal
      prefix:
        description: >-
          App name prefix (<prefix>-api, <prefix>-worker-preview, …). Fly app
          names are globally unique across every account, so a plain word is
          usually already taken by a stranger.
        required: true
        type: string
        default: vectorize4u
      lanes:
        description: >-
          "three" is §4.2: a worker app per queue, so a 500-file batch can
          never delay a preview. "single" is one worker taking every lane
          at a third of the cost, and gives that guarantee up — right
          until somebody is actually waiting on a preview.
        required: true
        type: choice
        default: single
        options:
          - single
          - three
      size:
        description: >-
          "staging" runs every worker on a small shared VM — right for a
          deployment nobody is using yet. "launch" uses the performance
          VMs §4.2 assumes, which cost roughly ten times as much and are
          what the preview latency target was written for.
        required: true
        type: choice
        default: staging
        options:
          - staging
          - launch
      site:
        description: >-
          The deployed site, used by the stripe stage to derive the checkout
          return URLs. The startup check refuses production while they still
          say localhost, so they are derived rather than remembered.
        required: false
        type: string
        default: https://vectorize4u.vercel.app
      confirm_live:
        description: >-
          Only for the stripe stage, and only with a live key. "yes" means
          create real products and prices in the real account and start
          charging real cards. Anything else refuses a live key outright.
        required: false
        type: string
        default: "no"
      db_app:
        description: >-
          Existing Postgres app to attach to. Separate from the prefix so
          changing the prefix does not silently create a second database.
        required: true
        type: string
        default: vectorize-db

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  # Names are derived from one input so a second environment, or a name
  # somebody already took, is a single field rather than an edit across
  # five files.
  API_APP: ${{ inputs.prefix }}-api
  REDIS_APP: ${{ inputs.prefix }}-redis
  DB_APP: ${{ inputs.db_app }}


jobs:
  bootstrap:
    if: inputs.stage == 'bootstrap' || inputs.stage == 'everything'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Which worker apps this shape needs
        run: |
          if [ "${{ inputs.lanes }}" = "single" ]; then
            echo "WORKER_APPS=${{ inputs.prefix }}-worker" >> "$GITHUB_ENV"
          else
            names="${{ inputs.prefix }}-worker-preview"
            names="$names ${{ inputs.prefix }}-worker-sync"
            names="$names ${{ inputs.prefix }}-worker-batch"
            echo "WORKER_APPS=$names" >> "$GITHUB_ENV"
          fi

      - name: Which organisation is this token in
        run: |
          # Printed first because every "app not found" three steps later
          # is really this: the wrong org, or a name another account holds.
          flyctl orgs list

      - name: Create the apps
        run: |
          # pipefail matters here: without it the exit status of
          # `cmd | tee` is tee's, so a real failure (wrong org, name taken
          # by another account) is swallowed and surfaces three steps later
          # as something unrelated.
          set -u -o pipefail
          for app in "$API_APP" "$REDIS_APP" $WORKER_APPS; do
            if flyctl apps create "$app" --org "${{ inputs.org }}" 2>&1 | tee /tmp/out; then
              echo "created $app"
            elif grep -qiE "already|taken|exists" /tmp/out; then
              echo "$app already exists — fine"
            else
              echo "could not create $app:"
              cat /tmp/out
              exit 1
            fi
          done
          flyctl apps list

      - name: Postgres
        run: |
          set -u
          if flyctl postgres list 2>/dev/null | grep -q "$DB_APP"; then
            echo "$DB_APP already exists"
          else
            flyctl postgres create \
              --name "$DB_APP" \
              --org "${{ inputs.org }}" \
              --region "${{ inputs.region }}" \
              --initial-cluster-size 1 \
              --vm-size shared-cpu-1x \
              --volume-size 10
          fi
          # A Fly Postgres machine that has auto-stopped has no leader, and
          # every attach then fails with "no active leader found" — which
          # reads like a broken cluster and is really a sleeping one. Wake
          # it and wait for it to elect a leader before asking it for
          # anything.
          for id in $(flyctl machine list -a "$DB_APP" --json | jq -r '.[].id'); do
            echo "starting $DB_APP machine $id"
            flyctl machine start "$id" -a "$DB_APP" || true
          done

          for attempt in $(seq 1 18); do
            if flyctl postgres users list -a "$DB_APP" > /dev/null 2>&1; then
              echo "$DB_APP has a leader"
              break
            fi
            if [ "$attempt" = "18" ]; then
              echo "$DB_APP never elected a leader. Either its volume is gone, or the"
              echo "cluster needs recreating: flyctl apps destroy $DB_APP, then re-run"
              echo "this stage. Managed Postgres (fly mpg) is the supported option."
              exit 1
            fi
            sleep 10
          done

          # One database, one user, the same DATABASE_URL on every app.
          #
          # Attaching each app separately — which is what this did, and is
          # the obvious reading of "every app needs the database" — gives
          # each app its *own* database: `flyctl postgres attach` defaults
          # both --database-name and --database-user to the name of the app
          # doing the attaching. Nothing about that fails loudly. The API
          # migrates and writes jobs into one database, the worker connects
          # successfully to another, and its first query raises on a `jobs`
          # table that was never created there. From outside, a preview sits
          # in 'queued' and every machine looks healthy.
          #
          # So the API attaches to a database named for the *product*, and
          # the workers are handed that same connection string. One user,
          # not one per app, because table privileges belong to whoever
          # created them: a per-app user would reach the right database and
          # still be refused by every table the API's migrations made.
          set -o pipefail
          SHARED_DB=vectorize
          SHARED_USER=vectorize

          # VEC_DB_SHARED marks an app as wired to the shared database, so
          # re-running this stage is free rather than destructive.
          wired="yes"
          for app in "$API_APP" $WORKER_APPS; do
            flyctl secrets list -a "$app" 2>/dev/null | grep -q VEC_DB_SHARED || wired=""
          done

          if [ -n "$wired" ]; then
            echo "every app already points at the $SHARED_DB database"
          else
            # Attach refuses while the app still holds the DATABASE_URL from
            # its old per-app attachment — "consumer app ... already contains
            # a secret named DATABASE_URL". `postgres detach` is the
            # documented way to clear that and it silently did not work here,
            # which cost a run of this stage precisely because its output went
            # to /dev/null. Removing the secret is one command that either
            # works or says why.
            #
            # The old per-app databases and users are left behind on purpose.
            # They hold nothing, nothing points at them any more, and dropping
            # a database to tidy up is not a thing this workflow should do
            # unattended.
            for app in "$API_APP" $WORKER_APPS; do
              if flyctl secrets unset DATABASE_URL -a "$app" --stage 2>&1 | tail -1; then
                echo "  cleared the old DATABASE_URL on $app"
              else
                echo "  $app had no DATABASE_URL to clear"
              fi
            done

            attach="$(flyctl postgres attach "$DB_APP" -a "$API_APP" \
                        --database-name "$SHARED_DB" \
                        --database-user "$SHARED_USER" --yes 2>&1 || true)"
            # That output carries the password, so it is never printed raw.
            echo "$attach" | sed -E 's#postgres://[^[:space:]]+#postgres://<redacted>#g'

            # `|| true` is load-bearing: pipefail is on, so a grep that
            # matches nothing fails the pipeline and, under the -e that
            # Actions runs steps with, kills the step here — printing a bare
            # "exit code 1" instead of the explanation directly below it.
            url="$(printf '%s' "$attach" | grep -oE 'postgres://[^[:space:]"]+' | head -1 || true)"
            if [ -z "$url" ]; then
              echo
              echo "The attach printed no connection string, so the workers cannot be"
              echo "given one. The redacted output above says why. Two common ones:"
              echo
              echo " * 'already contains a secret named DATABASE_URL' — an app still"
              echo "   holds its old per-app attachment. Clearing it is the step just"
              echo "   above; if that failed, it said so."
              echo " * 'database $SHARED_DB already exists' — a previous run got part"
              echo "   of the way. Drop that database, or pick another SHARED_DB."
              exit 1
            fi

            for app in $WORKER_APPS; do
              flyctl secrets set -a "$app" --stage "DATABASE_URL=$url" > /dev/null
              echo "$app now points at the same database as $API_APP"
            done
            for app in "$API_APP" $WORKER_APPS; do
              flyctl secrets set -a "$app" --stage "VEC_DB_SHARED=$SHARED_DB" > /dev/null
            done
          fi

      - name: Generate the secrets nobody should have to invent
        run: |
          set -u
          APPS="$API_APP $WORKER_APPS"
          for name in VEC_IP_HASH_SECRET VEC_WEBHOOK_SIGNING_SECRET VEC_JWT_DEV_SECRET; do
            missing=""
            for app in $APPS; do
              flyctl secrets list -a "$app" 2>/dev/null | grep -q "$name" || missing="yes"
            done
            if [ -z "$missing" ]; then
              echo "$name is already set everywhere"
              continue
            fi
            # One value across every app. VEC_WEBHOOK_SIGNING_SECRET is the
            # key customers verify our callbacks with, so two apps holding
            # different values is a silent, intermittent failure.
            value="$(openssl rand -base64 32)"
            for app in $APPS; do
              flyctl secrets set -a "$app" --stage "$name=$value" > /dev/null
            done
            echo "$name generated and set on every app"
          done

      - name: Point the configs at this run
        run: |
          # An app's region and VM size come from its fly.toml, which
          # cannot read a workflow input. Rewritten here, in the ephemeral
          # checkout, so one field still drives every app — and so machines
          # are never placed away from the volume bootstrap just created.
          sed -i 's/^primary_region = .*/primary_region = "${{ inputs.region }}"/' infra/*.toml
          if [ "${{ inputs.size }}" = "staging" ]; then
            # The performance VMs in these files are sized for §4.2's
            # latency promise under real traffic. Running them for a
            # deployment with no users is an expensive way to keep a
            # machine idle.
            sed -i 's/^  size = "performance-[0-9]*x"/  size = "shared-cpu-2x"/' \
              infra/fly.worker-*.toml
            sed -i 's/^  memory = "[48]gb"/  memory = "2gb"/' infra/fly.worker-*.toml
          fi
          grep -H -E 'primary_region|^  size|^  memory' infra/*.toml

      - name: Redis
        run: |
          set -u
          flyctl volumes list -a "$REDIS_APP" | grep -q redis_data || \
            flyctl volumes create redis_data --size 1 --region "${{ inputs.region }}" \
              -a "$REDIS_APP" --yes
          flyctl deploy -c infra/fly.redis.toml --image redis:7-alpine \
            -a "$REDIS_APP" --yes .

  secrets:
    # `everything` runs bootstrap first. The other stages skip it, and a
    # skipped dependency must not take this job with it — hence always().
    needs: [bootstrap]
    if: >-
      always()
      && (inputs.stage == 'secrets' || inputs.stage == 'everything')
      && (needs.bootstrap.result == 'success' || needs.bootstrap.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Which worker apps this shape needs
        run: |
          if [ "${{ inputs.lanes }}" = "single" ]; then
            echo "WORKER_APPS=${{ inputs.prefix }}-worker" >> "$GITHUB_ENV"
          else
            names="${{ inputs.prefix }}-worker-preview"
            names="$names ${{ inputs.prefix }}-worker-sync"
            names="$names ${{ inputs.prefix }}-worker-batch"
            echo "WORKER_APPS=$names" >> "$GITHUB_ENV"
          fi

      - name: Write the shared configuration
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -u
          for app in "$API_APP" $WORKER_APPS; do
            flyctl secrets set -a "$app" --stage \
              VEC_REDIS_URL="redis://${REDIS_APP}.internal:6379/0" \
              VEC_R2_BUCKET="$R2_BUCKET" \
              VEC_R2_ENDPOINT_URL="$R2_ENDPOINT_URL" \
              VEC_R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
              VEC_R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
              VEC_SUPABASE_URL="$SUPABASE_URL"
          done
          flyctl secrets set -a "$API_APP" --stage \
            VEC_PUBLIC_API_URL="https://${API_APP}.fly.dev"

      - name: Payments, if and only if Stripe is configured
        env:
          STRIPE_SECRET_KEY: ${{ secrets.VEC_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.VEC_STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICES: ${{ secrets.VEC_STRIPE_PRICES }}
          CHECKOUT_SUCCESS_URL: ${{ secrets.VEC_CHECKOUT_SUCCESS_URL }}
          CHECKOUT_CANCEL_URL: ${{ secrets.VEC_CHECKOUT_CANCEL_URL }}
          BILLING_PORTAL_RETURN_URL: ${{ secrets.VEC_BILLING_PORTAL_RETURN_URL }}
        run: |
          set -u
          # Adding the Stripe secrets to this repository is what turns
          # payments on. Until then the API runs with them off and
          # /v1/checkout answers 503 — which is a working site that cannot
          # sell yet, rather than a site that will not boot.
          if [ -z "${STRIPE_SECRET_KEY}" ] || [ -z "${STRIPE_PRICES}" ]; then
            # The `stripe` stage configures payments *directly*, because
            # price ids are created by a script rather than typed in. So an
            # absent repository secret no longer means "payments off" — it
            # means "not configured from here". Turning them off on that
            # basis would silently undo that stage on the next secrets run,
            # and the only symptom would be checkout answering 503.
            if flyctl secrets list -a "$API_APP" | grep -q VEC_STRIPE_PRICES; then
              echo "no Stripe configuration here, but the API already has prices"
              echo "from the stripe stage — leaving payments exactly as they are"
              exit 0
            fi
            echo "no Stripe configuration — payments stay off"
            flyctl secrets set -a "$API_APP" --stage VEC_PAYMENTS_ENABLED="0"
            exit 0
          fi
          flyctl secrets set -a "$API_APP" --stage \
            VEC_PAYMENTS_ENABLED="1" \
            VEC_STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
            VEC_STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" \
            VEC_STRIPE_PRICES="$STRIPE_PRICES" \
            VEC_CHECKOUT_SUCCESS_URL="$CHECKOUT_SUCCESS_URL" \
            VEC_CHECKOUT_CANCEL_URL="$CHECKOUT_CANCEL_URL" \
            VEC_BILLING_PORTAL_RETURN_URL="$BILLING_PORTAL_RETURN_URL"
          echo "payments configured"

  deploy:
    needs: [secrets]
    if: >-
      always()
      && (inputs.stage == 'deploy' || inputs.stage == 'everything')
      && (needs.secrets.result == 'success' || needs.secrets.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Point the configs at this run
        run: |
          # An app's region and VM size come from its fly.toml, which
          # cannot read a workflow input. Rewritten here, in the ephemeral
          # checkout, so one field still drives every app — and so machines
          # are never placed away from the volume bootstrap just created.
          sed -i 's/^primary_region = .*/primary_region = "${{ inputs.region }}"/' infra/*.toml
          if [ "${{ inputs.size }}" = "staging" ]; then
            # The performance VMs in these files are sized for §4.2's
            # latency promise under real traffic. Running them for a
            # deployment with no users is an expensive way to keep a
            # machine idle.
            sed -i 's/^  size = "performance-[0-9]*x"/  size = "shared-cpu-2x"/' \
              infra/fly.worker-*.toml
            sed -i 's/^  memory = "[48]gb"/  memory = "2gb"/' infra/fly.worker-*.toml
          fi
          grep -H -E 'primary_region|^  size|^  memory' infra/*.toml

      - name: Which worker apps this shape needs
        run: |
          if [ "${{ inputs.lanes }}" = "single" ]; then
            echo "WORKER_APPS=${{ inputs.prefix }}-worker" >> "$GITHUB_ENV"
          else
            names="${{ inputs.prefix }}-worker-preview"
            names="$names ${{ inputs.prefix }}-worker-sync"
            names="$names ${{ inputs.prefix }}-worker-batch"
            echo "WORKER_APPS=$names" >> "$GITHUB_ENV"
          fi

      - name: API (runs alembic upgrade head as its release command)
        run: |
          flyctl deploy --config infra/fly.api.toml --dockerfile Dockerfile \
            -a "$API_APP" --yes .

      - name: The worker lanes (§4.2)
        run: |
          set -u
          if [ "${{ inputs.lanes }}" = "single" ]; then
            flyctl deploy --config infra/fly.worker-single.toml \
              --dockerfile infra/Dockerfile.worker \
              -a "${{ inputs.prefix }}-worker" --yes .
          else
            for lane in preview sync batch; do
              flyctl deploy --config "infra/fly.worker-$lane.toml" \
                --dockerfile infra/Dockerfile.worker \
                -a "${{ inputs.prefix }}-worker-$lane" --yes .
            done
          fi

      - name: Smoke test
        run: |
          set -eu
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "https://${API_APP}.fly.dev/health"; then
              echo && echo "healthy"
              exit 0
            fi
            echo "not up yet (attempt $attempt)"
            sleep 10
          done
          echo "the API never answered /health — check: flyctl logs -a $API_APP"
          exit 1

  verify:
    needs: [deploy]
    if: >-
      always()
      && (inputs.stage == 'deploy' || inputs.stage == 'verify' || inputs.stage == 'everything')
      && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Which worker apps this shape needs
        run: |
          if [ "${{ inputs.lanes }}" = "single" ]; then
            echo "WORKER_APPS=${{ inputs.prefix }}-worker" >> "$GITHUB_ENV"
          else
            names="${{ inputs.prefix }}-worker-preview"
            names="$names ${{ inputs.prefix }}-worker-sync"
            names="$names ${{ inputs.prefix }}-worker-batch"
            echo "WORKER_APPS=$names" >> "$GITHUB_ENV"
          fi

      # /health proves the API process booted and nothing else. This walks
      # the anonymous preview path — presigned PUT to R2, a job through the
      # broker, a tracer subprocess in the worker image, an SVG back — so a
      # green run means the stack converts images, not that it starts.
      #
      # It is its own stage as well as the tail of `deploy` because the
      # useful question after a config change is "does it still work?",
      # and answering that should not require shipping code again.
      - name: Convert an image end to end
        run: python scripts/verify_live.py "https://${API_APP}.fly.dev"

      # Printing the commands to run next is no use to someone holding a
      # phone. The evidence that names the cause — is there a machine, is
      # it running, and what did it say before it stopped — is three
      # flyctl calls, so make the failing run carry it.
      - name: What the machines are actually doing
        if: failure()
        run: |
          # The stage that fails has to reach the verdict itself. Collapsed log
          # groups are unreadable on the phone this whole workflow exists for, so
          # the evidence is still collected below, but the conclusion is printed
          # first, unwrapped, in the few lines worth screenshotting.
          set -u

          # The preview lane is the one the verification uses, so it is the one
          # whose silence matters.
          if [ "${{ inputs.lanes }}" = "single" ]; then
            LANE_APP="${{ inputs.prefix }}-worker"
          else
            LANE_APP="${{ inputs.prefix }}-worker-preview"
          fi

          machines="$(flyctl machine list -a "$LANE_APP" --json 2>/dev/null || echo '[]')"
          total="$(echo "$machines" | jq 'length' 2>/dev/null || echo 0)"
          started="$(echo "$machines" | jq '[.[] | select(.state == "started")] | length' 2>/dev/null || echo 0)"
          logs="$(flyctl logs -a "$LANE_APP" --no-tail 2>&1 | tail -300 || true)"

          signal() { echo "$logs" | grep -cE "$1" 2>/dev/null || true; }
          ready="$(signal 'celery@')"
          refused="$(signal 'Cannot connect to redis')"
          crashed="$(signal 'Traceback')"
          unsafe="$(signal 'unsafe configuration')"
          # Celery's wording is "Task worker.tasks.vectorize_job[id] received",
          # not "Received task". Grepping for the latter reported a worker that
          # was consuming happily as one that had never started.
          consumed="$(signal 'Task .* received')"
          # A traceback through celery's trace.py is a *task* raising, which
          # says nothing about booting. Telling the two apart matters: one is
          # an image or configuration fault, the other is a bug in the job.
          in_task="$(signal 'celery/app/trace.py')"

          echo "=============================================================="
          echo " $LANE_APP: $total machine(s), $started started"
          echo " log signals: celery-banner=$ready broker-refused=$refused"
          echo "              traceback=$crashed unsafe-config=$unsafe received-task=$consumed"
          echo "--------------------------------------------------------------"
          if [ "$total" = "0" ]; then
            echo " VERDICT: the app has no machines at all. The deploy never placed"
            echo "          one, or it was destroyed. Re-run the deploy stage."
          elif [ "$started" = "0" ]; then
            echo " VERDICT: machines exist but none is started, so nothing is"
            echo "          consuming the lane. States above; start them with"
            echo "          flyctl machine start -a $LANE_APP"
          elif [ "$unsafe" != "0" ]; then
            echo " VERDICT: the startup check refused the configuration. The line"
            echo "          beginning 'unsafe configuration:' names every problem."
          elif [ "$refused" != "0" ]; then
            echo " VERDICT: the worker is running but cannot reach the broker at"
            echo "          ${REDIS_APP}.internal:6379. Celery retries a hundred"
            echo "          times without exiting, which is why the machine looks"
            echo "          healthy while the queue never drains. Check that"
            echo "          $REDIS_APP has a started machine, and that"
            echo "          VEC_REDIS_URL is set on $LANE_APP."
          elif [ "$in_task" != "0" ]; then
            echo " VERDICT: the worker is running and IS receiving the job. The task"
            echo "          itself raises. Delivery, the broker and the image are all"
            echo "          fine; the exception below is the whole fault. A failure in"
            echo "          the first database call means this app is not looking at"
            echo "          the same database as $API_APP."
          elif [ "$crashed" != "0" ]; then
            echo " VERDICT: the worker is raising on boot, before Celery prints its"
            echo "          banner — so it dies while importing, not while working."
          elif [ "$ready" = "0" ]; then
            echo " VERDICT: the machine is up but Celery never printed its banner,"
            echo "          so the process is not the worker or it dies before"
            echo "          logging."
          elif [ "$consumed" = "0" ]; then
            echo " VERDICT: Celery started and connected, but received no task."
            echo "          The API published to a queue this worker is not"
            echo "          consuming, or to a different broker. Compare"
            echo "          VEC_REDIS_URL on $LANE_APP and $API_APP, and check"
            echo "          QUEUES includes queue_preview."
          else
            echo " VERDICT: the worker did receive tasks. The failure is inside the"
            echo "          job, not in delivery — see the log group below."
          fi
          echo "--------------------------------------------------------------"

          # The excerpt belongs *in* the verdict, not in a fold below it.
          # A traceback the reader has to go and find is a traceback that
          # costs another run of this workflow to look at.
          if [ "$unsafe" != "0" ]; then
            echo "$logs" | grep 'unsafe configuration' | tail -2
          elif [ "$crashed" != "0" ]; then
            # The last traceback — head *and* tail, never the first thirty
            # lines. A Python traceback puts the exception type and message
            # at the end, so truncating from the top prints frame after
            # frame of library internals and drops the one line that says
            # what went wrong. That cost a run of this workflow to learn.
            echo "$logs" | awk '
              /Traceback/ { start = NR }
              { line[NR] = $0 }
              END {
                if (!start) exit
                n = NR - start + 1
                if (n <= 32) {
                  for (i = start; i <= NR; i++) print line[i]
                  exit
                }
                for (i = start; i < start + 10; i++) print line[i]
                printf "        ... %d frames elided ...\n", n - 30
                for (i = NR - 19; i <= NR; i++) print line[i]
              }'
          elif [ "$ready" = "0" ]; then
            echo "$logs" | tail -25
          fi
          echo "=============================================================="
          echo

          for app in $WORKER_APPS "$REDIS_APP" "$API_APP"; do
            echo "::group::$app — machines"
            flyctl machine list -a "$app" || true
            echo "::endgroup::"
          done
          for app in $WORKER_APPS "$API_APP"; do
            echo "::group::$app — configured secrets (names only)"
            # `secrets list` prints names and digests, never values.
            flyctl secrets list -a "$app" || true
            echo "::endgroup::"
            echo "::group::$app — recent logs"
            flyctl logs -a "$app" --no-tail 2>&1 | tail -80 || true
            echo "::endgroup::"
          done

  stripe:
    # Its own stage, and never part of `everything`. Creating products and
    # prices in somebody's Stripe account is not a thing to do as a side
    # effect of shipping code.
    if: inputs.stage == 'stripe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refuse a live key unless it was asked for
        env:
          STRIPE_SECRET_KEY: ${{ secrets.VEC_STRIPE_SECRET_KEY }}
        run: |
          set -u
          if [ -z "${STRIPE_SECRET_KEY}" ]; then
            echo "The VEC_STRIPE_SECRET_KEY repository secret is not set."
            echo "Start in test mode: Stripe dashboard -> Developers -> API keys,"
            echo "with the 'Test mode' toggle ON, and copy the secret key (sk_test_...)."
            exit 1
          fi
          # `case` rather than a substring check, so a key that merely
          # contains the word cannot pass for one that starts with it.
          case "$STRIPE_SECRET_KEY" in
            sk_live_*)
              if [ "${{ inputs.confirm_live }}" != "yes" ]; then
                echo "That is a LIVE key, and this run did not ask for live mode."
                echo
                echo "Live mode creates real products and prices in the real"
                echo "account, and turns on charging real cards. Run this stage"
                echo "again with confirm_live: yes if that is what you mean."
                exit 1
              fi
              echo "LIVE mode, confirmed by this run's input."
              ;;
            sk_test_*) echo "test mode" ;;
            *)
              echo "That does not look like a Stripe secret key (sk_test_ or sk_live_)."
              echo "A publishable key (pk_) cannot create products."
              exit 1
              ;;
          esac

      # The engine first, and from the path: apps/api depends on
      # vectorize-engine, which is this repository's own package and is not
      # on PyPI, so installing the API alone fails looking for it there.
      # Same order as infra/Dockerfile.worker, for the same reason.
      # `stripe` comes with the API's dependencies, so it is not repeated.
      - run: pip install --quiet ./packages/engine ./apps/api

      - name: Products, prices and the webhook endpoint
        env:
          VEC_STRIPE_SECRET_KEY: ${{ secrets.VEC_STRIPE_SECRET_KEY }}
        working-directory: apps/api
        run: |
          set -u
          # --emit, not stdout: Stripe returns a webhook signing secret once,
          # at creation, and a log is forever. Price ids are not secret and
          # are printed; the file carries the one value that is.
          python scripts/bootstrap_stripe.py \
            --webhook-url "https://${API_APP}.fly.dev/v1/stripe/webhook" \
            --emit "$RUNNER_TEMP/stripe.json"

      - name: Hand it to the API
        env:
          STRIPE_SECRET_KEY: ${{ secrets.VEC_STRIPE_SECRET_KEY }}
          SITE_URL: ${{ inputs.site }}
        run: |
          set -u
          PRICES="$(jq -c '.prices' "$RUNNER_TEMP/stripe.json")"
          WHSEC="$(jq -r '.webhook_secret // empty' "$RUNNER_TEMP/stripe.json")"
          SITE="${SITE_URL%/}"

          # The three return URLs must be on the site, and the startup check
          # refuses production while they still say localhost — so they are
          # derived here rather than left to be remembered.
          flyctl secrets set -a "$API_APP" --stage \
            VEC_STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
            VEC_STRIPE_PRICES="$PRICES" \
            VEC_CHECKOUT_SUCCESS_URL="$SITE/checkout/success" \
            VEC_CHECKOUT_CANCEL_URL="$SITE/#pricing" \
            VEC_BILLING_PORTAL_RETURN_URL="$SITE/account" > /dev/null
          echo "set the key, the prices and the three return URLs"

          if [ -n "$WHSEC" ]; then
            flyctl secrets set -a "$API_APP" --stage \
              VEC_STRIPE_WEBHOOK_SECRET="$WHSEC" > /dev/null
            echo "set the webhook signing secret from the endpoint just created"
          elif flyctl secrets list -a "$API_APP" | grep -q VEC_STRIPE_WEBHOOK_SECRET; then
            echo "the webhook endpoint already existed and the API already holds a"
            echo "signing secret — left alone"
          else
            echo
            echo "The webhook endpoint already existed, so Stripe returned no signing"
            echo "secret, and the API does not have one. Until it does, every paid"
            echo "event is rejected and no credits are granted."
            echo "Roll it: Stripe -> Developers -> Webhooks -> that endpoint -> reveal"
            echo "or roll the signing secret, put it in the VEC_STRIPE_WEBHOOK_SECRET"
            echo "repository secret, and run the secrets stage."
            exit 1
          fi

          # Last, so a failure above leaves payments off rather than half on.
          flyctl secrets set -a "$API_APP" --stage VEC_PAYMENTS_ENABLED="1" > /dev/null
          echo "payments enabled"

      - name: What is left to do
        run: |
          echo "Staged, not live: secrets reach the machines on a deploy."
          echo "Run this workflow again with stage: deploy."
          echo
          echo "Then check it with the payments stage of Verify the site, and make"
          echo "a test purchase with Stripe's 4242 4242 4242 4242 card."
