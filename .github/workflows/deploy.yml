# Deploy from GitHub's web UI, because a phone has no terminal.
#
# Everything here is normally `flyctl` on a laptop. Run from Actions →
# Deploy → "Run workflow" instead, and the only credential that exists is
# FLY_API_TOKEN in this repository's secrets — it never passes through a
# chat window or a developer's shell history.
#
# The stages are separate on purpose: `bootstrap` creates things and is
# safe to re-run, `secrets` writes configuration, `deploy` ships code, and
# `verify` converts a real image against whatever is already live.
# Running them out of order fails loudly rather than half-deploying.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: What to run
        required: true
        type: choice
        default: bootstrap
        options:
          - bootstrap
          - secrets
          - deploy
          - verify
          - everything
      region:
        description: Fly region — all apps and the database must share one
        required: true
        type: string
        default: ams
      org:
        description: >-
          Fly organisation *slug*, which is not its name — a personal
          account is displayed under your own name and its slug is
          "personal". `flyctl orgs list` prints both; so does the first
          step of this job.
        required: true
        type: string
        default: personal
      prefix:
        description: >-
          App name prefix (<prefix>-api, <prefix>-worker-preview, …). Fly app
          names are globally unique across every account, so a plain word is
          usually already taken by a stranger.
        required: true
        type: string
        default: vectorize4u
      lanes:
        description: >-
          "three" is §4.2: a worker app per queue, so a 500-file batch can
          never delay a preview. "single" is one worker taking every lane
          at a third of the cost, and gives that guarantee up — right
          until somebody is actually waiting on a preview.
        required: true
        type: choice
        default: single
        options:
          - single
          - three
      size:
        description: >-
          "staging" runs every worker on a small shared VM — right for a
          deployment nobody is using yet. "launch" uses the performance
          VMs §4.2 assumes, which cost roughly ten times as much and are
          what the preview latency target was written for.
        required: true
        type: choice
        default: staging
        options:
          - staging
          - launch
      db_app:
        description: >-
          Existing Postgres app to attach to. Separate from the prefix so
          changing the prefix does not silently create a second database.
        required: true
        type: string
        default: vectorize-db

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  # Names are derived from one input so a second environment, or a name
  # somebody already took, is a single field rather than an edit across
  # five files.
  API_APP: ${{ inputs.prefix }}-api
  REDIS_APP: ${{ inputs.prefix }}-redis
  DB_APP: ${{ inputs.db_app }}


jobs:
  bootstrap:
    if: inputs.stage == 'bootstrap' || inputs.stage == 'everything'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Which worker apps this shape needs
        run: |
          if [ "${{ inputs.lanes }}" = "single" ]; then
            echo "WORKER_APPS=${{ inputs.prefix }}-worker" >> "$GITHUB_ENV"
          else
            names="${{ inputs.prefix }}-worker-preview"
            names="$names ${{ inputs.prefix }}-worker-sync"
            names="$names ${{ inputs.prefix }}-worker-batch"
            echo "WORKER_APPS=$names" >> "$GITHUB_ENV"
          fi

      - name: Which organisation is this token in
        run: |
          # Printed first because every "app not found" three steps later
          # is really this: the wrong org, or a name another account holds.
          flyctl orgs list

      - name: Create the apps
        run: |
          # pipefail matters here: without it the exit status of
          # `cmd | tee` is tee's, so a real failure (wrong org, name taken
          # by another account) is swallowed and surfaces three steps later
          # as something unrelated.
          set -u -o pipefail
          for app in "$API_APP" "$REDIS_APP" $WORKER_APPS; do
            if flyctl apps create "$app" --org "${{ inputs.org }}" 2>&1 | tee /tmp/out; then
              echo "created $app"
            elif grep -qiE "already|taken|exists" /tmp/out; then
              echo "$app already exists — fine"
            else
              echo "could not create $app:"
              cat /tmp/out
              exit 1
            fi
          done
          flyctl apps list

      - name: Postgres
        run: |
          set -u
          if flyctl postgres list 2>/dev/null | grep -q "$DB_APP"; then
            echo "$DB_APP already exists"
          else
            flyctl postgres create \
              --name "$DB_APP" \
              --org "${{ inputs.org }}" \
              --region "${{ inputs.region }}" \
              --initial-cluster-size 1 \
              --vm-size shared-cpu-1x \
              --volume-size 10
          fi
          # A Fly Postgres machine that has auto-stopped has no leader, and
          # every attach then fails with "no active leader found" — which
          # reads like a broken cluster and is really a sleeping one. Wake
          # it and wait for it to elect a leader before asking it for
          # anything.
          for id in $(flyctl machine list -a "$DB_APP" --json | jq -r '.[].id'); do
            echo "starting $DB_APP machine $id"
            flyctl machine start "$id" -a "$DB_APP" || true
          done

          for attempt in $(seq 1 18); do
            if flyctl postgres users list -a "$DB_APP" > /dev/null 2>&1; then
              echo "$DB_APP has a leader"
              break
            fi
            if [ "$attempt" = "18" ]; then
              echo "$DB_APP never elected a leader. Either its volume is gone, or the"
              echo "cluster needs recreating: flyctl apps destroy $DB_APP, then re-run"
              echo "this stage. Managed Postgres (fly mpg) is the supported option."
              exit 1
            fi
            sleep 10
          done

          # Attach per app, not once: each gets its own database user, and
          # each gets DATABASE_URL set on it. The workers write jobs,
          # credits and usage, so they need it too — and app/config.py
          # adopts DATABASE_URL and renames the driver, so nobody copies a
          # connection string by hand.
          set -o pipefail
          for app in "$API_APP" $WORKER_APPS; do
            if flyctl postgres attach "$DB_APP" -a "$app" --yes 2>&1 | tee /tmp/attach; then
              echo "attached $DB_APP to $app"
            elif grep -qiE "already|exists|duplicate" /tmp/attach; then
              echo "$app is already attached — fine"
            else
              echo "could not attach the database to $app:"
              cat /tmp/attach
              exit 1
            fi
          done

      - name: Generate the secrets nobody should have to invent
        run: |
          set -u
          APPS="$API_APP $WORKER_APPS"
          for name in VEC_IP_HASH_SECRET VEC_WEBHOOK_SIGNING_SECRET VEC_JWT_DEV_SECRET; do
            missing=""
            for app in $APPS; do
              flyctl secrets list -a "$app" 2>/dev/null | grep -q "$name" || missing="yes"
            done
            if [ -z "$missing" ]; then
              echo "$name is already set everywhere"
              continue
            fi
            # One value across every app. VEC_WEBHOOK_SIGNING_SECRET is the
            # key customers verify our callbacks with, so two apps holding
            # different values is a silent, intermittent failure.
            value="$(openssl rand -base64 32)"
            for app in $APPS; do
              flyctl secrets set -a "$app" --stage "$name=$value" > /dev/null
            done
            echo "$name generated and set on every app"
          done

      - name: Point the configs at this run
        run: |
          # An app's region and VM size come from its fly.toml, which
          # cannot read a workflow input. Rewritten here, in the ephemeral
          # checkout, so one field still drives every app — and so machines
          # are never placed away from the volume bootstrap just created.
          sed -i 's/^primary_region = .*/primary_region = "${{ inputs.region }}"/' infra/*.toml
          if [ "${{ inputs.size }}" = "staging" ]; then
            # The performance VMs in these files are sized for §4.2's
            # latency promise under real traffic. Running them for a
            # deployment with no users is an expensive way to keep a
            # machine idle.
            sed -i 's/^  size = "performance-[0-9]*x"/  size = "shared-cpu-2x"/' \
              infra/fly.worker-*.toml
            sed -i 's/^  memory = "[48]gb"/  memory = "2gb"/' infra/fly.worker-*.toml
          fi
          grep -H -E 'primary_region|^  size|^  memory' infra/*.toml

      - name: Redis
        run: |
          set -u
          flyctl volumes list -a "$REDIS_APP" | grep -q redis_data || \
            flyctl volumes create redis_data --size 1 --region "${{ inputs.region }}" \
              -a "$REDIS_APP" --yes
          flyctl deploy -c infra/fly.redis.toml --image redis:7-alpine \
            -a "$REDIS_APP" --yes .

  secrets:
    # `everything` runs bootstrap first. The other stages skip it, and a
    # skipped dependency must not take this job with it — hence always().
    needs: [bootstrap]
    if: >-
      always()
      && (inputs.stage == 'secrets' || inputs.stage == 'everything')
      && (needs.bootstrap.result == 'success' || needs.bootstrap.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Which worker apps this shape needs
        run: |
          if [ "${{ inputs.lanes }}" = "single" ]; then
            echo "WORKER_APPS=${{ inputs.prefix }}-worker" >> "$GITHUB_ENV"
          else
            names="${{ inputs.prefix }}-worker-preview"
            names="$names ${{ inputs.prefix }}-worker-sync"
            names="$names ${{ inputs.prefix }}-worker-batch"
            echo "WORKER_APPS=$names" >> "$GITHUB_ENV"
          fi

      - name: Write the shared configuration
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -u
          for app in "$API_APP" $WORKER_APPS; do
            flyctl secrets set -a "$app" --stage \
              VEC_REDIS_URL="redis://${REDIS_APP}.internal:6379/0" \
              VEC_R2_BUCKET="$R2_BUCKET" \
              VEC_R2_ENDPOINT_URL="$R2_ENDPOINT_URL" \
              VEC_R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
              VEC_R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
              VEC_SUPABASE_URL="$SUPABASE_URL"
          done
          flyctl secrets set -a "$API_APP" --stage \
            VEC_PUBLIC_API_URL="https://${API_APP}.fly.dev"

      - name: Payments, if and only if Stripe is configured
        env:
          STRIPE_SECRET_KEY: ${{ secrets.VEC_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.VEC_STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICES: ${{ secrets.VEC_STRIPE_PRICES }}
          CHECKOUT_SUCCESS_URL: ${{ secrets.VEC_CHECKOUT_SUCCESS_URL }}
          CHECKOUT_CANCEL_URL: ${{ secrets.VEC_CHECKOUT_CANCEL_URL }}
          BILLING_PORTAL_RETURN_URL: ${{ secrets.VEC_BILLING_PORTAL_RETURN_URL }}
        run: |
          set -u
          # Adding the Stripe secrets to this repository is what turns
          # payments on. Until then the API runs with them off and
          # /v1/checkout answers 503 — which is a working site that cannot
          # sell yet, rather than a site that will not boot.
          if [ -z "${STRIPE_SECRET_KEY}" ] || [ -z "${STRIPE_PRICES}" ]; then
            echo "no Stripe configuration — payments stay off"
            flyctl secrets set -a "$API_APP" --stage VEC_PAYMENTS_ENABLED="0"
            exit 0
          fi
          flyctl secrets set -a "$API_APP" --stage \
            VEC_PAYMENTS_ENABLED="1" \
            VEC_STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
            VEC_STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" \
            VEC_STRIPE_PRICES="$STRIPE_PRICES" \
            VEC_CHECKOUT_SUCCESS_URL="$CHECKOUT_SUCCESS_URL" \
            VEC_CHECKOUT_CANCEL_URL="$CHECKOUT_CANCEL_URL" \
            VEC_BILLING_PORTAL_RETURN_URL="$BILLING_PORTAL_RETURN_URL"
          echo "payments configured"

  deploy:
    needs: [secrets]
    if: >-
      always()
      && (inputs.stage == 'deploy' || inputs.stage == 'everything')
      && (needs.secrets.result == 'success' || needs.secrets.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Point the configs at this run
        run: |
          # An app's region and VM size come from its fly.toml, which
          # cannot read a workflow input. Rewritten here, in the ephemeral
          # checkout, so one field still drives every app — and so machines
          # are never placed away from the volume bootstrap just created.
          sed -i 's/^primary_region = .*/primary_region = "${{ inputs.region }}"/' infra/*.toml
          if [ "${{ inputs.size }}" = "staging" ]; then
            # The performance VMs in these files are sized for §4.2's
            # latency promise under real traffic. Running them for a
            # deployment with no users is an expensive way to keep a
            # machine idle.
            sed -i 's/^  size = "performance-[0-9]*x"/  size = "shared-cpu-2x"/' \
              infra/fly.worker-*.toml
            sed -i 's/^  memory = "[48]gb"/  memory = "2gb"/' infra/fly.worker-*.toml
          fi
          grep -H -E 'primary_region|^  size|^  memory' infra/*.toml

      - name: Which worker apps this shape needs
        run: |
          if [ "${{ inputs.lanes }}" = "single" ]; then
            echo "WORKER_APPS=${{ inputs.prefix }}-worker" >> "$GITHUB_ENV"
          else
            names="${{ inputs.prefix }}-worker-preview"
            names="$names ${{ inputs.prefix }}-worker-sync"
            names="$names ${{ inputs.prefix }}-worker-batch"
            echo "WORKER_APPS=$names" >> "$GITHUB_ENV"
          fi

      - name: API (runs alembic upgrade head as its release command)
        run: |
          flyctl deploy --config infra/fly.api.toml --dockerfile Dockerfile \
            -a "$API_APP" --yes .

      - name: The worker lanes (§4.2)
        run: |
          set -u
          if [ "${{ inputs.lanes }}" = "single" ]; then
            flyctl deploy --config infra/fly.worker-single.toml \
              --dockerfile infra/Dockerfile.worker \
              -a "${{ inputs.prefix }}-worker" --yes .
          else
            for lane in preview sync batch; do
              flyctl deploy --config "infra/fly.worker-$lane.toml" \
                --dockerfile infra/Dockerfile.worker \
                -a "${{ inputs.prefix }}-worker-$lane" --yes .
            done
          fi

      - name: Smoke test
        run: |
          set -eu
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "https://${API_APP}.fly.dev/health"; then
              echo && echo "healthy"
              exit 0
            fi
            echo "not up yet (attempt $attempt)"
            sleep 10
          done
          echo "the API never answered /health — check: flyctl logs -a $API_APP"
          exit 1

  verify:
    needs: [deploy]
    if: >-
      always()
      && (inputs.stage == 'deploy' || inputs.stage == 'verify' || inputs.stage == 'everything')
      && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Which worker apps this shape needs
        run: |
          if [ "${{ inputs.lanes }}" = "single" ]; then
            echo "WORKER_APPS=${{ inputs.prefix }}-worker" >> "$GITHUB_ENV"
          else
            names="${{ inputs.prefix }}-worker-preview"
            names="$names ${{ inputs.prefix }}-worker-sync"
            names="$names ${{ inputs.prefix }}-worker-batch"
            echo "WORKER_APPS=$names" >> "$GITHUB_ENV"
          fi

      # /health proves the API process booted and nothing else. This walks
      # the anonymous preview path — presigned PUT to R2, a job through the
      # broker, a tracer subprocess in the worker image, an SVG back — so a
      # green run means the stack converts images, not that it starts.
      #
      # It is its own stage as well as the tail of `deploy` because the
      # useful question after a config change is "does it still work?",
      # and answering that should not require shipping code again.
      - name: Convert an image end to end
        run: python scripts/verify_live.py "https://${API_APP}.fly.dev"

      # Printing the commands to run next is no use to someone holding a
      # phone. The evidence that names the cause — is there a machine, is
      # it running, and what did it say before it stopped — is three
      # flyctl calls, so make the failing run carry it.
      - name: What the machines are actually doing
        if: failure()
        run: |
          # The stage that fails has to reach the verdict itself. Collapsed log
          # groups are unreadable on the phone this whole workflow exists for, so
          # the evidence is still collected below, but the conclusion is printed
          # first, unwrapped, in the few lines worth screenshotting.
          set -u

          # The preview lane is the one the verification uses, so it is the one
          # whose silence matters.
          if [ "${{ inputs.lanes }}" = "single" ]; then
            LANE_APP="${{ inputs.prefix }}-worker"
          else
            LANE_APP="${{ inputs.prefix }}-worker-preview"
          fi

          machines="$(flyctl machine list -a "$LANE_APP" --json 2>/dev/null || echo '[]')"
          total="$(echo "$machines" | jq 'length' 2>/dev/null || echo 0)"
          started="$(echo "$machines" | jq '[.[] | select(.state == "started")] | length' 2>/dev/null || echo 0)"
          logs="$(flyctl logs -a "$LANE_APP" --no-tail 2>&1 | tail -300 || true)"

          signal() { echo "$logs" | grep -c "$1" 2>/dev/null || true; }
          ready="$(signal 'celery@')"
          refused="$(signal 'Cannot connect to redis')"
          crashed="$(signal 'Traceback')"
          unsafe="$(signal 'unsafe configuration')"
          consumed="$(signal 'Received task')"

          echo "=============================================================="
          echo " $LANE_APP: $total machine(s), $started started"
          echo " log signals: celery-banner=$ready broker-refused=$refused"
          echo "              traceback=$crashed unsafe-config=$unsafe received-task=$consumed"
          echo "--------------------------------------------------------------"
          if [ "$total" = "0" ]; then
            echo " VERDICT: the app has no machines at all. The deploy never placed"
            echo "          one, or it was destroyed. Re-run the deploy stage."
          elif [ "$started" = "0" ]; then
            echo " VERDICT: machines exist but none is started, so nothing is"
            echo "          consuming the lane. States above; start them with"
            echo "          flyctl machine start -a $LANE_APP"
          elif [ "$unsafe" != "0" ]; then
            echo " VERDICT: the startup check refused the configuration. The line"
            echo "          beginning 'unsafe configuration:' names every problem."
          elif [ "$refused" != "0" ]; then
            echo " VERDICT: the worker is running but cannot reach the broker at"
            echo "          ${REDIS_APP}.internal:6379. Celery retries a hundred"
            echo "          times without exiting, which is why the machine looks"
            echo "          healthy while the queue never drains. Check that"
            echo "          $REDIS_APP has a started machine, and that"
            echo "          VEC_REDIS_URL is set on $LANE_APP."
          elif [ "$crashed" != "0" ]; then
            echo " VERDICT: the worker is raising on boot. The traceback is in the"
            echo "          log group below."
          elif [ "$ready" = "0" ]; then
            echo " VERDICT: the machine is up but Celery never printed its banner,"
            echo "          so the process is not the worker or it dies before"
            echo "          logging. Check the log group below."
          elif [ "$consumed" = "0" ]; then
            echo " VERDICT: Celery started and connected, but received no task."
            echo "          The API published to a queue this worker is not"
            echo "          consuming, or to a different broker. Compare"
            echo "          VEC_REDIS_URL on $LANE_APP and $API_APP, and check"
            echo "          QUEUES includes queue_preview."
          else
            echo " VERDICT: the worker did receive tasks. The failure is inside the"
            echo "          job, not in delivery — see the log group below."
          fi
          echo "=============================================================="
          echo

          for app in $WORKER_APPS "$REDIS_APP" "$API_APP"; do
            echo "::group::$app — machines"
            flyctl machine list -a "$app" || true
            echo "::endgroup::"
          done
          for app in $WORKER_APPS "$API_APP"; do
            echo "::group::$app — configured secrets (names only)"
            # `secrets list` prints names and digests, never values.
            flyctl secrets list -a "$app" || true
            echo "::endgroup::"
            echo "::group::$app — recent logs"
            flyctl logs -a "$app" --no-tail 2>&1 | tail -80 || true
            echo "::endgroup::"
          done
